services:
  - type: web
    name: aura-aria-support
    env: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./aura_support.db
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: TTS_VOICE
        value: en-IN-NeerjaNeural
      - key: TTS_RATE
        value: +8%
      - key: LOG_LEVEL
        value: INFO
