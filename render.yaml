services:
  - type: web
    name: aura-aria-agent
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.agent
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: TTS_VOICE
        value: en-IN-NeerjaNeural
      - key: TTS_RATE
        value: +8%
